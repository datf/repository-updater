---
name: "Home Assistant Community Apps Repository Updater"
description: Tool for updating Home Assistant Apps repositories.
author: frenck

branding:
  color: red
  icon: thumbs-up

inputs:
  token:
    description: GitHub token that is allowed to write/commit to the target repo
    required: true
  repository:
    description: The app repository to update (e.g., frenck/repository)
    required: false
  app:
    description: Slug of the app to update the repository for
    required: false
  addon:
    description: (Deprecated) Use 'app' instead. Slug of the app to update the repository for
    required: false
  force:
    description: Force repository update, even if no changes are detected
    default: "false"
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install repository-updater==2.0.1

    - name: Run repository-updater
      shell: bash
      run: |
        if [[ -n "${{ inputs.repository }}" ]]; then
          ARGS+=( --repository "${{ inputs.repository }}" )
        fi

        if [[ -n "${{ inputs.app }}" ]]; then
          ARGS+=( --app "${{ inputs.app }}" )
        elif [[ -n "${{ inputs.addon }}" ]]; then
          ARGS+=( --addon "${{ inputs.addon }}" )
        fi

        if [[ "${{ inputs.force }}" == 'true' ]]; then
          ARGS+=( --force )
        fi

        repository-updater --token "${{ inputs.token }}" "${ARGS[@]}"
